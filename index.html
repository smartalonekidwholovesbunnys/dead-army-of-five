<!DOCTYPE html>
<html>

<head>
    <title>Dead Army Of Five</title>

    <style>

        body {
            margin: 0;
            background-image: url("field.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            height: 100vh;

            font-family: "Times New Roman", serif;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            font-weight: bold;
            margin-top: 20px;
            letter-spacing: 3px;
        }

        .people {
            position: absolute;

            bottom: 20%;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: flex-end;
            justify-content: center;

            gap: 35px;
        }

        .person {
            width: 150px;
            font-weight: bold;
        }

        .person img {
            width: 120px;
            height: 170px;

            object-fit: contain;
        }

        .name {
            font-size: 22px;
            margin-top: 5px;
            font-weight: bold;
        }

        .vanya {
            width: 120px;
            height: 170px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            font-size: 26px;
            font-weight: bold;
        }

        .quote {
            position: absolute;
            bottom: 30px;
            width: 100%;

            font-size: 18px;
            font-weight: bold;
        }

    </style>
</head>


<body>

    <h1>Dead Army Of Five</h1>


    <div class="people">

        <div class="person">
            <img src="cross.png">
            <div class="name">Gleb</div>
        </div>

        <div class="person">
            <img src="cross.png">
            <div class="name">Vlad</div>
        </div>

        <div class="person">
            <img src="cross.png">
            <div class="name">Denis</div>
        </div>

        <div class="person">
            <img src="cross.png">
            <div class="name">David</div>
        </div>

        <div class="person">

            <div class="vanya">
                Vanya
            </div>

        </div>

    </div>


    <div class="quote">

        "We were five. Now we are four."

    </div>

</body>

</html>
